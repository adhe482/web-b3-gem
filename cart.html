<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - Cookies Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span class="logo-icon">🍪</span>
                Cookies Store
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="shop.html">Produk</a></li>
                <li><a href="cart.html">Keranjang</a></li>
            </ul>
            <div class="cart-icon" onclick="window.location.href='cart.html'">
                🛒
                <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
            </div>
        </nav>
    </header>

    <!-- Cart Section -->
    <section class="cart-page">
        <h2 class="section-title">Keranjang Belanja</h2>
        
        <!-- Empty Cart -->
        <div class="cart-empty" id="cart-empty">
            <div class="cart-empty-icon">🛒</div>
            <p>Keranjang belanja Anda kosong</p>
            <a href="shop.html" class="btn btn-primary">Belanja Sekarang</a>
        </div>
        
        <!-- Cart Content -->
        <div id="cart-content" style="display: none;">
            <div class="cart-table">
                <table>
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Harga</th>
                            <th>Jumlah</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Cart items akan di-render oleh JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div class="cart-summary">
                <h3>Ringkasan Pesanan</h3>
                <div class="total-amount" id="cart-total">Rp 0</div>
                <a href="checkout.html" class="btn btn-primary" style="width: 100%; text-align: center; display: block; padding: 1rem;">
                    Lanjut ke Checkout
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>🍪 Cookies Store - Fresh Homemade Cookies</p>
        <p>Hubungi kami via WhatsApp untuk pemesanan</p>
        <div class="social-links">
            <a href="#">📱</a>
        </div>
    </footer>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script src="js/main.js"></script>
</body>
</html>
