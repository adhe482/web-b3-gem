<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Cookies Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span class="logo-icon">🍪</span>
                Cookies Store
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="shop.html">Produk</a></li>
                <li><a href="cart.html">Keranjang</a></li>
            </ul>
            <div class="cart-icon" onclick="window.location.href='cart.html'">
                🛒
                <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
            </div>
        </nav>
    </header>

    <!-- Checkout Section -->
    <section class="checkout-page">
        <h2 class="section-title">Checkout</h2>
        
        <form class="checkout-form" id="checkout-form">
            <h3>Data Pelanggan</h3>
            
            <div class="form-group">
                <label for="customer_name">Nama Lengkap *</label>
                <input type="text" id="customer_name" name="customer_name" placeholder="Masukkan nama lengkap Anda" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Nomor WhatsApp *</label>
                <input type="tel" id="phone" name="phone" placeholder="Contoh: 6281234567890" required>
            </div>
            
            <div class="form-group">
                <label for="address">Alamat Pengiriman</label>
                <textarea id="address" name="address" rows="3" placeholder="Masukkan alamat lengkap (opsional)"></textarea>
            </div>
            
            <div class="order-summary">
                <h3>Ringkasan Pesanan</h3>
                <div id="order-items">
                    <!-- Order items akan di-render oleh JavaScript -->
                </div>
                <div class="order-total">
                    <span>Total</span>
                    <span id="order-total-amount">Rp 0</span>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" id="submit-checkout" style="width: 100%;">
                Pesan Sekarang
            </button>
            
            <p style="text-align: center; margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                Setelah klik "Pesan Sekarang", Anda akan diarahkan ke WhatsApp untuk konfirmasi pesanan.
            </p>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>🍪 Cookies Store - Fresh Homemade Cookies</p>
        <p>Hubungi kami via WhatsApp untuk pemesanan</p>
        <div class="social-links">
            <a href="#">📱</a>
        </div>
    </footer>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
